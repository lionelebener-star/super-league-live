name: Daily football news
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect publisher feeds
        id: collect
        continue-on-error: true
        run: python scripts/update-news.py
      - name: Publish refreshed news and collection status
        run: |
          git config user.name 'lionelebener-star'
          git config user.email '330890247+lionelebener-star@users.noreply.github.com'
          git add public/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily football news'
            git push
          fi
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
